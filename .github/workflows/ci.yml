name: CI/CD

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --branch "$GITHUB_REF_NAME" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" .

      - name: Bump version
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          mvn -B build-helper:parse-version versions:set -DnewVersion='${parsedVersion.majorVersion}.${parsedVersion.minorVersion}.${parsedVersion.nextIncrementalVersion}' versions:commit
          echo "VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Build and push
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/simple-java-maven-app:$VERSION .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/simple-java-maven-app:$VERSION

      - name: Commit version
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Bump version to $VERSION"
          git push