name: Pipeline

on:
  workflow_call:
    inputs:
      runner:
        type: string
      registry:
        type: string

env:
  ECR: 258161363659.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        run: |
          find . -mindepth 1 -delete
          git clone --branch "$GITHUB_REF_NAME" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" .

      - name: Bump version
        id: bump
        run: |
          if [ -n "$JAVA_HOME_21_X64" ]; then export JAVA_HOME=$JAVA_HOME_21_X64; fi
          mvn -B build-helper:parse-version versions:set -DnewVersion='${parsedVersion.majorVersion}.${parsedVersion.minorVersion}.${parsedVersion.nextIncrementalVersion}' versions:commit
          VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push
        run: |
          if [ "${{ inputs.registry }}" = "ecr" ]; then
            aws ecr get-login-password --region eu-north-1 | docker login -u AWS --password-stdin $ECR
            IMAGE=$ECR/simple-java-maven-app
          else
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/simple-java-maven-app
          fi
          docker build -t $IMAGE:$VERSION .
          docker push $IMAGE:$VERSION

      - name: Commit version
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Bump version to $VERSION"
          git push

  deploy:
    needs: build
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Deploy and verify
        run: |
          if [ "${{ inputs.registry }}" = "ecr" ]; then
            aws ecr get-login-password --region eu-north-1 | docker login -u AWS --password-stdin $ECR
            IMAGE=$ECR/simple-java-maven-app
          else
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/simple-java-maven-app
          fi
          docker pull $IMAGE:${{ needs.build.outputs.version }}
          docker run --rm $IMAGE:${{ needs.build.outputs.version }} | grep "Hello World!"